<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VR 全景漫游</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-tap-highlight-color:transparent; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }

  canvas { display:block; position:fixed; inset:0; }

  /* ── Loading Overlay ── */
  #loading { position:fixed; inset:0; z-index:200; background:#0a0a12;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:opacity .7s cubic-bezier(.4,0,.2,1),visibility .7s; }
  #loading.done { opacity:0; visibility:hidden; pointer-events:none; }
  .ring { width:54px; height:54px; border:3px solid rgba(255,255,255,.07);
    border-top-color:#2dd4bf; border-right-color:#38bdf8; border-radius:50%;
    animation:spin 1.1s cubic-bezier(.6,.2,.4,.8) infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .prog-wrap { margin-top:22px; width:180px; height:4px; background:rgba(255,255,255,.06);
    border-radius:2px; overflow:hidden; }
  .prog-bar { height:100%; width:0%; background:linear-gradient(90deg,#2dd4bf,#38bdf8,#a78bfa);
    border-radius:2px; transition:width .25s ease; }
  .prog-text { margin-top:12px; color:rgba(255,255,255,.45); font-size:12px;
    letter-spacing:.8px; text-transform:uppercase; }
  .scene-title-loading { margin-top:30px; color:rgba(255,255,255,.18); font-size:22px;
    font-weight:700; letter-spacing:2px; }

  /* ── Cinematic Overlays ── */
  #vignette { position:fixed; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.5) 100%); }
  #top-shadow { position:fixed; top:0; left:0; right:0; height:140px; z-index:2;
    background:linear-gradient(to bottom,rgba(0,0,0,.6) 0%,transparent 100%); pointer-events:none; }
  #bottom-shadow { position:fixed; bottom:0; left:0; right:0; height:180px; z-index:2;
    background:linear-gradient(to top,rgba(0,0,0,.55) 0%,transparent 100%); pointer-events:none; }

  /* ── UI Controls ── */
  #controls { position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    padding:max(14px,env(safe-area-inset-top)) 14px 0; }
  .ctrl-btn { width:40px; height:40px; border-radius:50%; border:1px solid rgba(255,255,255,.15);
    background:rgba(0,0,0,.25); backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    color:#fff; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .2s ease; outline:none; -webkit-tap-highlight-color:transparent; }
  .ctrl-btn:active { background:rgba(255,255,255,.2); transform:scale(.9); }
  .ctrl-btn.on { background:rgba(45,212,191,.3); border-color:rgba(45,212,191,.5); color:#2dd4bf; }
  .ctrl-group { display:flex; gap:8px; }
  .scene-title { color:#fff; font-size:15px; font-weight:600; letter-spacing:.5px;
    text-shadow:0 1px 12px rgba(0,0,0,.7); pointer-events:none; }

  /* ── Bottom Info Bar ── */
  #info-bar { position:fixed; bottom:0; left:0; right:0; z-index:10; pointer-events:none;
    padding:0 16px max(14px,env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:center; gap:24px; }
  .info-item { display:flex; align-items:center; gap:6px; color:rgba(255,255,255,.7); font-size:11px;
    letter-spacing:.4px; text-shadow:0 1px 6px rgba(0,0,0,.5); }

  /* ── Hotspot Markers ── */
  .hotspot { position:fixed; z-index:5; pointer-events:auto; cursor:pointer;
    transform:translate(-50%,-50%); transition:opacity .5s; }
  .hotspot-dot { width:32px; height:32px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.7);
    box-shadow:0 0 20px rgba(45,212,191,.35),inset 0 0 8px rgba(255,255,255,.1);
    animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform:scale(1); opacity:1; }
    50% { transform:scale(1.35); opacity:.7; } }
  .hotspot-label { position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%);
    white-space:nowrap; color:#fff; font-size:11px; font-weight:500;
    background:rgba(0,0,0,.55); backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    padding:4px 12px; border-radius:99px; letter-spacing:.5px;
    border:1px solid rgba(255,255,255,.1); pointer-events:none; }
  .hotspot-tooltip { display:none; position:absolute; bottom:calc(100% + 14px); left:50%;
    transform:translateX(-50%); width:180px; background:rgba(0,0,0,.78); backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px); border-radius:12px; padding:12px; border:1px solid rgba(255,255,255,.12);
    text-align:center; }
  .hotspot-tooltip img { width:100%; height:80px; object-fit:cover; border-radius:8px; margin-bottom:6px; }
  .hotspot-tooltip h4 { color:#fff; font-size:13px; margin-bottom:2px; }
  .hotspot-tooltip p { color:rgba(255,255,255,.5); font-size:11px; }
  .hotspot:active .hotspot-tooltip { display:block; }

  /* ── Hint ── */
  #gesture-hint { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); z-index:8;
    color:rgba(255,255,255,.5); font-size:11px; letter-spacing:.5px; pointer-events:none;
    transition:opacity .8s ease; }
  #gesture-hint.fade { opacity:0; }

  /* ── Transition overlay ── */
  #transition-overlay { position:fixed; inset:0; z-index:150; background:#000; opacity:0;
    pointer-events:none; transition:opacity .5s ease; }
  #transition-overlay.active { opacity:1; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- Loading -->
<div id="loading">
  <div class="ring"></div>
  <div class="prog-wrap"><div class="prog-bar" id="prog-bar"></div></div>
  <div class="prog-text" id="prog-text">LOADING</div>
  <div class="scene-title-loading" id="loading-name"></div>
</div>

<!-- Cinematic layers -->
<div id="vignette"></div>
<div id="top-shadow"></div>
<div id="bottom-shadow"></div>

<!-- Controls -->
<div id="controls">
  <button class="ctrl-btn" id="btn-back" title="返回场景选择">✕</button>
  <span class="scene-title" id="hud-name"></span>
  <div class="ctrl-group">
    <button class="ctrl-btn" id="btn-gyro" title="陀螺仪模式">📱</button>
    <button class="ctrl-btn on" id="btn-rotate" title="自动旋转">🔄</button>
    <button class="ctrl-btn" id="btn-fs" title="全屏">⛶</button>
  </div>
</div>

<!-- Gesture hint -->
<div id="gesture-hint">↔ 拖动查看全景 · 双指缩放</div>

<!-- Bottom info -->
<div id="info-bar">
  <div class="info-item"><span style="color:#2dd4bf;">📍</span><span id="info-location"></span></div>
  <div class="info-item"><span>☀️</span><span id="info-weather"></span></div>
</div>

<!-- Hotspots container -->
<div id="hotspots-container"></div>

<!-- Transition -->
<div id="transition-overlay"></div>

<script src="three.min.js"></script>
<script>
(function(){
  'use strict';

  // ── Parse URL params ──────────────────────────────────────
  var p = new URLSearchParams(location.search);
  var initImage  = p.get('image')  || 'vr-1.jpg';
  var initName   = p.get('name')   || '广州塔 360°';
  var initCity   = p.get('city')   || '广州';
  var initWeather= p.get('weather')|| '32°C · 晴朗';

  // ── DOM refs ──────────────────────────────────────────────
  var canvas   = document.getElementById('c');
  var loading  = document.getElementById('loading');
  var progBar  = document.getElementById('prog-bar');
  var progText = document.getElementById('prog-text');
  var loadName = document.getElementById('loading-name');
  var hudName  = document.getElementById('hud-name');
  var infoLoc  = document.getElementById('info-location');
  var infoWthr = document.getElementById('info-weather');
  var hint     = document.getElementById('gesture-hint');
  var transOv  = document.getElementById('transition-overlay');
  var hotsCtr  = document.getElementById('hotspots-container');
  var btnBack  = document.getElementById('btn-back');
  var btnGyro  = document.getElementById('btn-gyro');
  var btnRotate= document.getElementById('btn-rotate');
  var btnFS    = document.getElementById('btn-fs');

  // ── State ─────────────────────────────────────────────────
  var autoRotate = true;
  var gyroActive = false;
  var gyroAlpha  = 0, gyroBeta = 0, gyroGamma = 0;
  var lon = 180, lat = 0;          // camera angles in degrees
  var targetLon = 180, targetLat = 0;
  var fov = 75, targetFov = 75;

  // Interaction state
  var isDragging  = false;
  var dragStartX  = 0, dragStartY = 0;
  var dragStartLon= 0, dragStartLat= 0;
  var velocityX   = 0, velocityY = 0;
  var lastDragX   = 0, lastDragY = 0;
  var lastDragTime= 0;

  // Pinch
  var pinchDist0  = 0;
  var pinchFov0   = 75;

  // ── Three.js setup ────────────────────────────────────────
  var renderer = new THREE.WebGLRenderer({ canvas:canvas, antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  var scene  = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(fov, window.innerWidth/window.innerHeight, 0.1, 2000);
  camera.position.set(0, 0, 0.1);

  // Sphere (inside-out for equirectangular)
  var geometry = new THREE.SphereGeometry(800, 64, 42);
  geometry.scale(-1, 1, 1);

  var texture, material, sphere;
  var currentImage = '';

  function createSphere(imgUrl) {
    if (sphere) { scene.remove(sphere); if (material) material.dispose(); }
    var tex = new THREE.TextureLoader().load(imgUrl,
      // onProgress
      function(xhr) {
        if (xhr.lengthComputable) {
          var pct = Math.round((xhr.loaded / xhr.total) * 100);
          progBar.style.width = pct + '%';
          progText.textContent = '加载中 ' + pct + '%';
        }
      },
      // onLoad
      function(tex) {
        progBar.style.width = '100%';
        progText.textContent = '准备就绪';
        setTimeout(function(){ loading.classList.add('done'); }, 400);
      },
      // onError
      function() {
        progText.textContent = '加载失败 · 请重试';
        progBar.style.background = '#ef4444';
      }
    );
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    texture = tex;
    material = new THREE.MeshBasicMaterial({ map:tex });
    sphere = new THREE.Mesh(geometry, material);
    scene.add(sphere);
    currentImage = imgUrl;
  }

  // ── Hotspot projection ────────────────────────────────────
  var hotspots = [];

  function projectToScreen(worldPos) {
    var v = worldPos.clone().project(camera);
    return {
      x: (v.x * 0.5 + 0.5) * window.innerWidth,
      y: (-v.y * 0.5 + 0.5) * window.innerHeight,
      visible: v.z < 1
    };
  }

  function setHotspots(list) {
    hotspots = list;
    hotsCtr.innerHTML = '';
    hotspots.forEach(function(hs) {
      var el = document.createElement('div');
      el.className = 'hotspot';
      el.innerHTML = '<div class="hotspot-dot">📍</div><div class="hotspot-label">'+hs.label+'</div>'+
        '<div class="hotspot-tooltip"><p>'+hs.desc+'</p></div>';
      el.addEventListener('click', function(e){ e.stopPropagation(); hs.onClick && hs.onClick(); });
      hotsCtr.appendChild(el);
    });
  }

  function updateHotspots() {
    var els = hotsCtr.children;
    hotspots.forEach(function(hs, i) {
      if (i >= els.length) return;
      var screen = projectToScreen(hs.worldPos);
      if (screen.visible) {
        els[i].style.display = 'block';
        els[i].style.left = screen.x + 'px';
        els[i].style.top = screen.y + 'px';
        els[i].style.opacity = '1';
      } else {
        els[i].style.opacity = '0';
      }
    });
  }

  // ── Camera update ─────────────────────────────────────────
  function updateCamera() {
    // Smooth lerp
    lon += (targetLon - lon) * 0.12;
    lat += (targetLat - lat) * 0.12;
    fov += (targetFov - fov) * 0.15;
    camera.fov = fov;
    camera.updateProjectionMatrix();

    var phi   = THREE.MathUtils.degToRad(90 - lat);
    var theta = THREE.MathUtils.degToRad(lon);
    var R = 0.1;
    camera.position.x = R * Math.sin(phi) * Math.cos(theta);
    camera.position.y = R * Math.cos(phi);
    camera.position.z = R * Math.sin(phi) * Math.sin(theta);
    camera.lookAt(0, 0, 0);
  }

  // ── Render loop ───────────────────────────────────────────
  var lastFrame = performance.now();
  function animate(now) {
    requestAnimationFrame(animate);
    var dt = Math.min((now - lastFrame) / 1000, 0.1);
    lastFrame = now;

    // Inertia
    if (!isDragging && !gyroActive && Math.abs(velocityX) > 0.01) {
      targetLon += velocityX * dt * 60;
      velocityX *= 0.94;
    }
    if (!isDragging && !gyroActive && Math.abs(velocityY) > 0.01) {
      targetLat += velocityY * dt * 60;
      velocityY *= 0.94;
    }

    // Auto-rotate
    if (autoRotate && !isDragging && !gyroActive) {
      targetLon += 10 * dt;
    }

    // Gyroscope
    if (gyroActive) {
      targetLon = 180 - gyroAlpha;
      targetLat = Math.max(-85, Math.min(85, gyroBeta - 45));
    }

    // Clamp lat
    targetLat = Math.max(-85, Math.min(85, targetLat));

    updateCamera();
    updateHotspots();
    renderer.render(scene, camera);
  }

  // ── Mouse events ──────────────────────────────────────────
  canvas.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    isDragging = true;
    dragStartX = e.clientX; dragStartY = e.clientY;
    dragStartLon = targetLon; dragStartLat = targetLat;
    velocityX = 0; velocityY = 0;
    lastDragX = e.clientX; lastDragY = e.clientY;
    lastDragTime = performance.now();
    canvas.style.cursor = 'grabbing';
    hint.classList.add('fade');
  });

  window.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    var dx = e.clientX - dragStartX;
    var dy = e.clientY - dragStartY;
    targetLon = dragStartLon - dx * 0.3;
    targetLat = dragStartLat + dy * 0.3;

    var now = performance.now();
    var dt = Math.max(now - lastDragTime, 1);
    velocityX = -(e.clientX - lastDragX) / dt * 16;
    velocityY = (e.clientY - lastDragY) / dt * 16;
    lastDragX = e.clientX; lastDragY = e.clientY; lastDragTime = now;
  });

  window.addEventListener('mouseup', function() {
    isDragging = false;
    canvas.style.cursor = 'grab';
  });

  canvas.addEventListener('wheel', function(e) {
    e.preventDefault();
    targetFov = Math.max(30, Math.min(110, targetFov + e.deltaY * 0.05));
  }, { passive:false });

  canvas.style.cursor = 'grab';

  // ── Touch events ──────────────────────────────────────────
  canvas.addEventListener('touchstart', function(e) {
    hint.classList.add('fade');
    if (e.touches.length === 1) {
      isDragging = true;
      dragStartX = e.touches[0].clientX;
      dragStartY = e.touches[0].clientY;
      dragStartLon = targetLon;
      dragStartLat = targetLat;
      velocityX = 0; velocityY = 0;
    } else if (e.touches.length === 2) {
      isDragging = false;
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchDist0 = Math.sqrt(dx*dx + dy*dy);
      pinchFov0 = targetFov;
    }
  }, { passive:false });

  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (e.touches.length === 1 && isDragging) {
      var dx = e.touches[0].clientX - dragStartX;
      var dy = e.touches[0].clientY - dragStartY;
      targetLon = dragStartLon - dx * 0.25;
      targetLat = dragStartLat + dy * 0.25;
      velocityX = 0; velocityY = 0;
    } else if (e.touches.length === 2) {
      var dx2 = e.touches[0].clientX - e.touches[1].clientX;
      var dy2 = e.touches[0].clientY - e.touches[1].clientY;
      var dist = Math.sqrt(dx2*dx2 + dy2*dy2);
      var scale = pinchDist0 / Math.max(dist, 1);
      targetFov = Math.max(30, Math.min(110, pinchFov0 * scale));
    }
  }, { passive:false });

  canvas.addEventListener('touchend', function() { isDragging = false; });

  // ── Gyroscope ─────────────────────────────────────────────
  function enableGyro() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(function(state) { if (state==='granted') listenGyro(); })
        .catch(function(){});
    } else {
      listenGyro();
    }
  }

  function listenGyro() {
    gyroActive = true;
    btnGyro.classList.add('on');
    window.addEventListener('deviceorientation', onGyro, true);
  }

  function disableGyro() {
    gyroActive = false;
    btnGyro.classList.remove('on');
    window.removeEventListener('deviceorientation', onGyro, true);
  }

  function onGyro(e) {
    if (e.alpha !== null) gyroAlpha = e.alpha;
    if (e.beta  !== null) gyroBeta  = e.beta;
    if (e.gamma !== null) gyroGamma = e.gamma;
  }

  btnGyro.addEventListener('click', function() {
    if (gyroActive) disableGyro(); else enableGyro();
  });

  // ── Fullscreen ────────────────────────────────────────────
  btnFS.addEventListener('click', function() {
    var el = document.documentElement;
    if (document.fullscreenElement) {
      document.exitFullscreen();
      btnFS.classList.remove('on');
    } else {
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el).then(function(){
        btnFS.classList.add('on');
      }).catch(function(){});
    }
  });
  document.addEventListener('fullscreenchange', function() {
    if (!document.fullscreenElement) btnFS.classList.remove('on');
  });

  // ── Auto-rotate toggle ───────────────────────────────────
  btnRotate.addEventListener('click', function() {
    autoRotate = !autoRotate;
    if (autoRotate) btnRotate.classList.add('on');
    else btnRotate.classList.remove('on');
  });

  // ── Back button ───────────────────────────────────────────
  btnBack.addEventListener('click', function() {
    notifyRN({ type:'back' });
  });

  // ── Scene switching ───────────────────────────────────────
  function switchScene(imageUrl, name, city, weather) {
    transOv.classList.add('active');
    loading.classList.remove('done');
    progBar.style.width = '0%';
    progText.textContent = 'LOADING';
    loadName.textContent = name;
    hudName.textContent = name;
    infoLoc.textContent = city;
    if (weather) infoWthr.textContent = weather;

    setTimeout(function() {
      createSphere(imageUrl);
      transOv.classList.remove('active');
    }, 500);
  }

  // ── postMessage bridge ────────────────────────────────────
  function notifyRN(obj) {
    obj._src = 'vr-viewer';
    var s = JSON.stringify(obj);
    if (window.ReactNativeWebView) { window.ReactNativeWebView.postMessage(s); }
    else if (window.parent && window.parent !== window) { window.parent.postMessage(s, '*'); }
  }

  // Receive commands
  window.addEventListener('message', function(e) {
    var d;
    try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; }
    catch(_) { return; }
    if (!d || d._src !== 'vr-cmd') return;
    if (d.type === 'switchScene') {
      switchScene(d.image, d.name, d.city, d.weather);
    }
  });

  // For native injectJavaScript
  window.__vrCmd = function(json) {
    try {
      var d = JSON.parse(json);
      if (d.type === 'switchScene') switchScene(d.image, d.name, d.city, d.weather);
    } catch(e) {}
  };

  // ── Keyboard ──────────────────────────────────────────────
  window.addEventListener('keydown', function(e) {
    switch(e.key) {
      case 'ArrowLeft':  targetLon -= 15; break;
      case 'ArrowRight': targetLon += 15; break;
      case 'ArrowUp':    targetLat += 10; break;
      case 'ArrowDown':  targetLat -= 10; break;
      case 'f': btnFS.click(); break;
      case 'r': btnRotate.click(); break;
      case 'Escape': if (document.fullscreenElement) { document.exitFullscreen(); }
                     else notifyRN({ type:'back' }); break;
    }
  });

  // ── Resize ────────────────────────────────────────────────
  window.addEventListener('resize', function() {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });

  // ── Init ──────────────────────────────────────────────────
  loadName.textContent = initName;
  hudName.textContent  = initName;
  infoLoc.textContent  = initCity;
  infoWthr.textContent = initWeather;

  createSphere(initImage);

  // Default hotspots for each scene
  setHotspots([
    { label:'观景台', desc:'俯瞰城市全景的最佳视角', worldPos:new THREE.Vector3(600,80,-500), onClick:function(){ notifyRN({type:'hotspot',name:'观景台'}); } },
    { label:'文化区', desc:'了解岭南文化的窗口', worldPos:new THREE.Vector3(-400,30,-650), onClick:function(){ notifyRN({type:'hotspot',name:'文化区'}); } },
    { label:'美食街', desc:'品尝地道广东美食', worldPos:new THREE.Vector3(-100,-100,750), onClick:function(){ notifyRN({type:'hotspot',name:'美食街'}); } },
  ]);

  // Hide hint after 6 seconds
  setTimeout(function(){ hint.classList.add('fade'); }, 6000);

  requestAnimationFrame(animate);

  // Notify RN that viewer is ready
  setTimeout(function(){ notifyRN({ type:'ready' }); }, 800);

})();
</script>
</body>
</html>
